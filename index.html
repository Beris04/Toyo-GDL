<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<title>Toyo Foods · Comercial</title>
<style>
:root{--b:#0b4ea2;--b2:#073675;--bg:#f3f7fc;--tx:#13233d;--mu:#718198;--ln:#dce6f1;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}button,select,input{font:inherit}button{cursor:pointer}
.shell{max-width:540px;margin:auto;padding:calc(18px + var(--st)) 14px calc(28px + var(--sb))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:54px;height:54px;border-radius:15px;object-fit:contain}.brand b{font-size:18px;display:block}.brand span{font-size:11px;color:var(--mu)}
.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border-radius:22px;padding:20px;box-shadow:0 15px 36px #0b4ea22b}.hero small{opacity:.78;font-weight:800}.hero h1{font-size:24px;margin:7px 0 5px}.hero p{font-size:12px;line-height:1.5;margin:0;opacity:.9}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 7px 22px #17324d0d}
.field{margin-top:12px}label{display:block;font-size:11px;color:var(--mu);font-weight:800;margin-bottom:6px}select,input{width:100%;height:49px;border:1px solid #cfdaea;border-radius:14px;padding:0 12px;background:#fff;font-size:14px}
.primary{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;font-weight:900;margin-top:14px}.err{display:none;color:#b42318;font-size:11px;margin-top:9px}.err.show{display:block}
.home{display:none}.home.show{display:block}.login.hide{display:none}
.user{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:13px;background:#eaf2ff;display:grid;place-items:center;font-size:20px}.user b{font-size:13px;display:block}.user span{font-size:10px;color:var(--mu);display:block;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.mod{min-height:132px;border:1px solid var(--ln);background:#fff;border-radius:19px;padding:15px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 7px 20px #17324d0d}.ico{width:42px;height:42px;border-radius:14px;background:#eaf2ff;display:grid;place-items:center;font-size:21px}.mod b{font-size:14px}.mod span{display:block;color:var(--mu);font-size:10px;line-height:1.4;margin-top:4px}.mod.quote .ico{background:#e9f8f1}.mod.admin .ico{background:#f2eaff}
.logout{border:0;background:#fff;color:#b42318;font-weight:800;font-size:11px;padding:10px 0;margin-top:14px;width:100%}.status{font-size:10px;color:var(--mu);text-align:center;margin-top:14px}
@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><img src="assets/toyo_logo.png" alt="Toyo Foods"><div><b>Toyo Foods</b><span>Comercial · Web móvil V6.2</span></div></div>

  <section class="hero"><small>WEB MÓVIL ULTRA LIGERA</small><h1>Visitas y Cotizaciones</h1><p>La pantalla inicial no carga mapas, Cloud, clientes ni catálogos. Cada módulo descarga únicamente lo que necesita.</p></section>

  <section id="login" class="card login">
    <b>Iniciar sesión</b>
    <div class="field"><label>Usuario</label><select id="user"><option value="">Selecciona usuario</option></select></div>
    <div class="field"><label>Contraseña</label><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password"></div>
    <button id="enter" class="primary">Entrar</button>
    <div id="err" class="err">Usuario o contraseña incorrectos.</div>
  </section>

  <section id="home" class="home">
    <div class="card user"><div class="avatar">👤</div><div><b id="who">—</b><span id="scope">—</span></div></div>
    <div class="grid">
      <button class="mod" id="visitas"><div class="ico">📍</div><div><b>Visitas</b><span>Registro, GPS y seguimiento.</span></div></button>
      <button class="mod quote" id="cotizar"><div class="ico">🧾</div><div><b>Cotizar</b><span>Solo precio bruto. Carga la cartera del vendedor.</span></div></button>
      <button class="mod admin" id="admin" style="display:none"><div class="ico">📊</div><div><b>Admin</b><span>Cloud, reportes y exportación.</span></div></button>
    </div>
    <button id="logout" class="logout">Cerrar sesión</button>
  </section>
  <div id="net" class="status"></div>
</main>
<script>
const SELLERS={"CDMX":["David Adrian Hernández Guzmán","Javier Espinosa Olivares","Ricardo Gutierrez Bandera","Abraham Rene Valdes Gonzales","Jesus Antonio Ramirez Rivera","Sergio Servin Rivera","Eduardo Faustino Hernandez Sanchez","Khiroyuki Sakurai","Andres Fierro Ibañez","Jonathan Ramirez","Tohru Kurasawa","Tanno Nobuko"],"MTY":["Jessica Palomo","Luis Heredia","Carla Hernández","Salomé Barron"],"GDL":["Aguilar Neri Daniel","De la Cruz Ponce Julio Cesar","Garibay Ortiz Sergio Joel","Sierra de Anda Aldo","Perez Mar Alan Roberto","Reynoso Aguilar Maricela","Sandra Navarro Navarro","Aguirre Ojeda Arcenio","Velez Castellanos Antonio","Yepez Mora Oscar Alberto","Sanchez Esmeralda","Reynaga Valeria","González Guzmán Cristian Eduardo"],"AGS":["Hernandez Gonzalez Angel Miguel"],"PUE":["Victor Mendez","Yael Mojica"],"QRO":["Roberto Lopez"]};
const CITY_LABELS={"GDL":"Guadalajara","MTY":"Monterrey","CDMX":"México","AGS":"Aguascalientes","PUE":"Puebla","QRO":"Querétaro"};
const AUTH_KEY='app_visitas_auth_v2', PASS='Toyo2026';
const $=s=>document.querySelector(s);
function accounts(){const a={Admin:{role:'admin',city:'ALL',vendor:'ALL'}};Object.entries(SELLERS).forEach(([city,vs])=>vs.forEach(v=>a[v]={role:'seller',city,vendor:v}));return a}
const ACC=accounts();
function getAuth(){try{const x=JSON.parse(localStorage.getItem(AUTH_KEY)||sessionStorage.getItem(AUTH_KEY)||'null');return x&&x.ok?x:null}catch(e){return null}}
function setAuth(x){
  try{
    if(x){
      const raw=JSON.stringify(x);
      localStorage.setItem(AUTH_KEY,raw);
      sessionStorage.setItem(AUTH_KEY,raw);
    }else{
      localStorage.removeItem(AUTH_KEY);
      sessionStorage.removeItem(AUTH_KEY);
    }
  }catch(e){}
  draw();
}
function fill(){const s=$('#user');const adm=document.createElement('option');adm.value='Admin';adm.textContent='Admin';s.appendChild(adm);Object.entries(SELLERS).forEach(([c,vs])=>{const g=document.createElement('optgroup');g.label=CITY_LABELS[c]||c;vs.slice().sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;g.appendChild(o)});s.appendChild(g)})}
function draw(){const a=getAuth();$('#login').classList.toggle('hide',!!a);$('#home').classList.toggle('show',!!a);if(!a)return;$('#who').textContent=a.user;$('#scope').textContent=a.role==='admin'?'Administrador':`${CITY_LABELS[a.city]||a.city} · ${a.vendor}`;$('#admin').style.display=a.role==='admin'?'':'none'}
function login(){const u=$('#user').value,p=$('#pass').value,pr=ACC[u],ok=!!pr&&p===PASS;$('#err').classList.toggle('show',!ok);if(ok){setAuth({ok:true,user:u,role:pr.role,city:pr.city,vendor:pr.vendor});$('#pass').value=''}}
function sellerSlug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
$('#enter').onclick=login;$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#logout').onclick=()=>setAuth(null);
$('#visitas').onclick=()=>location.href='visitas.html';
$('#admin').onclick=()=>location.href='visitas.html#/admin';
$('#cotizar').onclick=()=>{const a=getAuth();if(!a||a.role!=='seller')return;const u=new URL('cotizador.html',location.href);u.searchParams.set('from','home');u.searchParams.set('seller',a.vendor);u.searchParams.set('city',a.city);location.href=u.href};
function net(){$('#net').textContent=navigator.onLine?'● En línea':'● Sin conexión'}window.addEventListener('online',net);window.addEventListener('offline',net);
fill();draw();net();
// Retira Service Workers/cachés de versiones anteriores sin registrar uno nuevo.
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if('caches' in window)caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{});
</script>
</body>
</html>
