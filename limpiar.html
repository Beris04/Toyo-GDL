<body><div class="c"><h2>Actualizando App Comercial</h2><p id="s">Limpiando caché de versiones anteriores…</p><a class="b" href="index.html?v=60">Abrir App Comercial V6</a></div>
<script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}document.getElementById('s').textContent='Listo. V6 no usa Service Worker ni PWA.'})();</script></body></html>
