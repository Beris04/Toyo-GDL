<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4ea2"><title>Toyo Foods · Actualizar app</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f6fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#11213b;padding:22px}.card{width:min(430px,100%);background:#fff;border:1px solid #dce5f0;border-radius:22px;padding:24px;box-shadow:0 18px 50px #12304f18;text-align:center}.dot{width:56px;height:56px;border-radius:18px;background:#eaf2ff;display:grid;place-items:center;margin:0 auto 13px;font-size:25px}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#6b7b92;line-height:1.45}.btn{width:100%;height:48px;border:0;border-radius:14px;background:#0b4ea2;color:white;font-weight:900;margin-top:12px}</style></head><body><div class="card"><div class="dot">⚡</div><h1 id="t">Actualizando App Toyo</h1><p id="m">Eliminando caché antiguo para Safari y Chrome…</p><button class="btn" id="b" style="display:none">Abrir App Comercial</button></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}document.getElementById('t').textContent='App actualizada';document.getElementById('m').textContent='Listo. Ya puedes abrir la versión móvil ligera.';const b=document.getElementById('b');b.style.display='block';b.onclick=()=>location.replace('./?v=50')})();</script></body></html>
